name: Publish to npm

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    if: github.event.pull_request.merged == true && github.event.pull_request.merged_by.login == 'AlSayedGamal'
    runs-on: ubuntu-latest
    # Publishes with npm trusted publishing (OIDC), so there is no NPM_TOKEN to
    # expire or to need a one-time password. The trusted publisher is set up on
    # npmjs.com for this repository and this workflow file name; renaming
    # publish.yml breaks it. See https://docs.npmjs.com/trusted-publishers
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install -g npm@^11.5.1

      # See ci.yml for why --legacy-peer-deps is needed here.
      - run: npm install --legacy-peer-deps

      - run: npm run check

      - run: npm run build

      - name: Check if this version is already published
        id: version_check
        run: |
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          if npm view "mcp-voice-simulator@$LOCAL_VERSION" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.version_check.outputs.already_published == 'false'
        # No NODE_AUTH_TOKEN on purpose: a token, if set, would be used instead of OIDC.
        run: npm publish
